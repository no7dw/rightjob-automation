<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>BOSS fixture · synthetic only</title><style>
body{margin:0;background:#eef7f7;font:14px/1.6 system-ui;color:#263e42;user-select:none}.top{background:#17383c;color:white;padding:20px 70px}.search-condition{padding:12px 70px}.condition-filter-select{width:max-content;margin:0 70px 12px;cursor:pointer}.layout{display:flex;gap:20px;margin:10px 70px}.job-list-container{width:370px;height:700px;overflow:auto;padding-left:42px}.rec-job-list{padding:0;margin:0;list-style:none}.job-card-box{background:white;list-style:none;padding:18px;margin:0 0 14px;border-radius:12px;min-height:140px}.job-title{display:flex;gap:10px}.job-name{color:#087c80;text-decoration:none;font-weight:600;max-width:190px}.job-salary{color:#ed615b;margin-left:auto;white-space:nowrap}.job-card-footer{display:flex;justify-content:space-between}.company-location{color:#71898b;font-size:12px}.tag-list{display:flex;gap:8px;list-style:none;padding:0;font-size:12px;color:#587176}.job-detail-container{width:650px;max-height:700px;overflow:auto;background:white;padding:25px;border-radius:12px}.job-detail-info{display:flex}.desc{white-space:pre-wrap}.hidden-noise{visibility:hidden;font-size:0}.more-job-btn{color:#087c80}button{cursor:pointer}#contact-dialog,#city-dialog{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#17383c99}#contact-dialog[hidden],#city-dialog[hidden]{display:none}#contact-dialog .dialog-card,#city-dialog .dialog-card{background:white;padding:28px;border-radius:12px;text-align:center}#contact-dialog button{margin:12px 6px 0}#city-dialog button{padding:8px 20px;margin:6px}
</style><div class="top">BOSS fixture · 所有职位均为模拟数据</div><div class="search-condition">技术经理（深圳） | 城市未核实</div><div class="condition-filter-select">城市</div><div class="layout"><div class="job-list-container"><ul class="rec-job-list"></ul></div><div class="job-detail-container"><div class="job-detail-box"></div></div></div><div id="contact-dialog" hidden><div class="dialog-card"><p>已向BOSS发送消息</p><button data-action="stay">留在此页</button><button data-action="continue">继续沟通</button></div></div><div id="city-dialog" hidden><div class="dialog-card"><h2>请选择城市</h2><button data-city="深圳">深圳</button><button data-city="北京">北京</button></div></div><script>
const list=document.querySelector('.rec-job-list'), detail=document.querySelector('.job-detail-box');
const contactDialog=document.querySelector('#contact-dialog');
const cityDialog=document.querySelector('#city-dialog'),cityTrigger=document.querySelector('.condition-filter-select');
window.fixture={chatClicks:0,likeClicks:0,dismissedDialogs:0,defaultClicks:0,cityClicks:0,cityPopups:0,mismatch:false,showCalls:[],showContactPopup:true,bonusMode:'',sendClicks:0,continueClicks:0};
function show(id){window.fixture.showCalls.push(id);detail.innerHTML='<p>Loading…</p>';setTimeout(()=>{const salary=id==='job2'?'-K':'30-50K·13薪';const target=window.fixture.mismatch?'wrong-id':id;detail.innerHTML=`<div class="job-detail-info"><span class="job-name">Agent平台架构师</span><span class="job-salary">${salary}</span></div><ul class="tag-list"><li>上海</li><li>5-10年</li><li>本科</li></ul><div class="job-boss-info"><div><h2 class="name">模拟招聘方<span class="boss-active-time">今日活跃</span></h2></div></div><div class="job-detail-body"><h3>职位描述</h3><p class="desc">岗位职责：构建生产级 Python / Go Agent 平台，负责架构、RAG、MCP、工具集成和自动化。<span class="hidden-noise">这段隐藏噪声不应采集</span>\n任职要求：8年以上后端经验，熟悉工作流编排和数据平台，支持电商业务。</p></div><a class="more-job-btn" href="/job_detail/${target}.html?securityId=secret">查看更多信息</a><a id="chat" href="javascript:window.fixture.defaultClicks++">立即沟通</a><button id="like">收藏</button>`;if(window.fixture.bonusMode && id==='job1')detail.querySelector('.desc').append(window.fixture.bonusMode==='chat_no_matches'?'\n加分项\n• 有大模型应用开发经验（提示词工程、上下文工程、Agent开发、RAG、模型微调等）；\n• 曾有AI落地项目经验优先；':'\n加分项：有AI Agent平台建设经验');if(window.fixture.emptyJD)detail.querySelector('.desc').textContent='';if(window.fixture.longJD){const desc=detail.querySelector('.desc');desc.style.font='18px/30px Arial';desc.textContent=Array.from({length:100},(_,i)=>'Agent Requirement SECTION_'+String(i).padStart(3,'0')).join('\n');}if(['chat_already','chat_resume'].includes(window.fixture.bonusMode)&&id==='job1')detail.querySelector('#chat').textContent='继续沟通';detail.querySelector('#chat').onclick=()=>{if(detail.querySelector('#chat').textContent==='继续沟通'){contactDialog.querySelector('[data-action="continue"]').click();return;}window.fixture.chatClicks++;if(window.fixture.showContactPopup)contactDialog.hidden=false;bonusContact(id);};detail.querySelector('#like').onclick=()=>window.fixture.likeClicks++;},350);}
contactDialog.querySelector('[data-action="stay"]').onclick=()=>{window.fixture.dismissedDialogs++;contactDialog.hidden=true;};
contactDialog.querySelector('[data-action="continue"]').onclick=()=>{window.fixture.continueClicks++;contactDialog.hidden=true;if(window.fixture.bonusMode==='chat_spa'){history.pushState({},'','/web/geek/chat?fixture_job=job1');document.body.insertAdjacentHTML('beforeend','<div class="chat-conversation"><a href="/job_detail/job1.html">查看职位</a><div id="chat-input" contenteditable="true" style="min-height:100px;border:1px solid"></div><button id="send-bonus">发送</button></div>');window.sendClicks=0;window.contactClicks=[];document.querySelector('#chat-input').addEventListener('blur',()=>sessionStorage.setItem('drafts',JSON.stringify({target:document.querySelector('#chat-input').textContent})));document.querySelector('#send-bonus').onclick=()=>{window.sendClicks++;document.querySelector('#chat-input').textContent='';};}else if(window.fixture.bonusMode==='chat_same')location.href='/web/geek/chat?fixture_job=job1';else if(window.fixture.bonusMode.startsWith('chat'))window.open('/web/geek/chat?fixture_job='+ (window.fixture.bonusMode==='chat_wrong'?'wrong-job':'job1'),'_blank');};
function bonusContact(id){if(window.fixture.bonusMode!=='inline'||id!=='job1')return;const root=document.createElement('div');root.className='chat-conversation';root.innerHTML='<a href="/job_detail/job1.html">查看职位</a><div id="chat-input" contenteditable="true" style="min-width:250px;min-height:60px;border:1px solid"></div><button data-action="send">发送</button>';root.querySelector('[data-action=send]').onclick=()=>{window.fixture.sendClicks++;root.querySelector('#chat-input').textContent='';};contactDialog.querySelector('.dialog-card').append(root);}
cityTrigger.onclick=()=>{window.fixture.cityPopups++;cityDialog.hidden=false;};
cityDialog.querySelector('[data-city="深圳"]').onclick=()=>{window.fixture.cityClicks++;cityDialog.hidden=true;cityTrigger.textContent='深圳';history.replaceState({},'',"?city=101280600");};
cityDialog.querySelector('[data-city="北京"]').onclick=()=>{cityDialog.hidden=true;cityTrigger.textContent='北京';history.replaceState({},'','?city=101010100');};
for(let n=1;n<=35;n++){const card=document.createElement('li');card.className='job-card-box';card.innerHTML=`<div class="job-info"><div class="job-title"><a class="job-name" href="/job_detail/job${n}.html">Agent平台架构师</a><span class="job-salary">${n===2?'-K':'30-50K·13薪'}</span></div><ul class="tag-list"><li>5-10年</li><li>本科</li></ul></div><div class="job-card-footer"><a class="boss-info"><span class="boss-name">模拟招聘方</span></a><span class="company-name">模拟公司 ${n}</span><span class="company-location">${n===3?'上海':'深圳'}</span></div>`;card.querySelector('.job-name').onclick=e=>{e.preventDefault();show('job'+n);};list.append(card);}show('job1');document.addEventListener('copy',e=>e.preventDefault());
</script></html>

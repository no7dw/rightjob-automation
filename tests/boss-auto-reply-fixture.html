<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>BOSS 自动回复测试 · 模拟招聘方</title>
<style>
body { font:16px/1.6 system-ui; background:#e7f5f6; margin:25px; display:flex; gap:15px; }
.contacts { width:330px; background:white; height:760px; overflow:auto; }
.user-list-header { padding:15px; } button { cursor:pointer; padding:8px; }
.user-list { padding:0; list-style:none; } .user-list li { padding:18px; cursor:pointer; }
.active { background:#d5f0ef; } .notice-badge { background:#ff6b60; color:white; border-radius:10px; padding:2px 6px; }
.name { font-weight:bold; } .company-name,.preview { color:#777; } .preview { display:block; }
.chat-conversation { background:white; width:570px; padding:25px; min-height:650px; }
.item-friend { margin:25px 0; background:#f6f6f6; padding:12px; }
.dialog-wrap { position:fixed; top:140px; left:180px; width:500px; padding:25px; background:white; border:2px solid #40c7c4; }
.resume-item { padding:18px; cursor:pointer; } .resume-item.selected { background:#d5f0ef; }
[hidden] { display:none!important; }
</style>
<section class="contacts"><div class="user-list-header"><button role="tab" id="all">全部</button> <button role="tab" id="unread">未读(4)</button></div><ul class="user-list"></ul></section>
<section class="chat-conversation"><div class="top-info-content"></div><div class="chat-record"></div><button class="btn-resume">发简历</button></section>
<div class="dialog-wrap" role="dialog" hidden><h3>请选择要发送的简历</h3><div class="resume-list"></div><button id="cv-send" disabled>发送</button><button id="cv-close">关闭</button></div>
<script>
window.events=[];window.mode=new URLSearchParams(location.search).get('mode')||'normal';
window.contacts=[
 {id:'decline', name:'张女士', company:'模拟甲公司', preview:'[祈祷] 不好意思，不太合适哦'},
 {id:'cv', name:'谢女士', company:'模拟乙公司', preview:'我想要一份您的附件简历，您是否同意'},
 {id:'question', name:'同女士', company:'模拟丙公司', preview:'您能介绍一下项目经验吗'},
 {id:'apology', name:'王先生', company:'模拟丁公司', preview:'不好意思，刚刚在开会'},
];
window.current=null;window.picked=null;window.onlyUnread=false;
const list=document.querySelector('.user-list'),header=document.querySelector('.top-info-content'),record=document.querySelector('.chat-record'),dialog=document.querySelector('.dialog-wrap');
function render(){list.replaceChildren();for(const c of contacts){if(onlyUnread&&c.read)continue;const row=document.createElement('li');row.dataset.id=c.id;row.classList.toggle('active',c.id===current);row.innerHTML=`<div class="friend-content"><span class="name">${c.name}</span> <span class="company-name">${c.company}</span> ${c.read?'':'<span class="notice-badge">1</span>'}<span class="preview">${c.preview}</span></div>`;row.onclick=()=>open(c);list.append(row);}}
function open(c){events.push('read:'+c.id);current=c.id;c.read=true;render();header.innerHTML='加载中';record.innerHTML='';setTimeout(()=>{header.innerHTML=`<span class="name">${(mode==='wrong'||mode==='retry')?'另一位招聘方':c.name}</span> <span class="company-name">${c.company}</span>`;record.innerHTML=`<div class="item-friend"><span class="text">${mode==='stale'?'您的简历已收到':c.preview}</span></div>`;if(mode==='already')record.innerHTML+='<p>附件简历请求已发送</p>';},mode==='delayed'?1200:150);if(mode==='retry')setTimeout(()=>{header.innerHTML=`<span class="name">${c.name}</span> <span class="company-name">${c.company}</span>`;},4500);}
document.querySelector('#unread').onclick=()=>{events.push('filter:unread');onlyUnread=true;render();};
document.querySelector('#all').onclick=()=>{onlyUnread=false;render();};
document.querySelector('.btn-resume').onclick=()=>{events.push('open:resume');dialog.hidden=false;const names=mode==='missing'?['Candidate-CV.pdf']:mode==='ambiguous'?['old-cn.pdf','new-cn.pdf']:['Candidate-CV.pdf','Candidate-CV-cn.pdf'];document.querySelector('.resume-list').replaceChildren();for(const name of names){const row=document.createElement('div');row.className='resume-item';row.innerHTML=`<span class="resume-name">${name}</span>`;row.onclick=()=>{events.push('pick:'+name);picked=name;document.querySelectorAll('.resume-item').forEach(n=>n.classList.toggle('selected',n===row));document.querySelector('#cv-send').disabled=false;if(mode==='switch')header.innerHTML='<span class="name">另一位招聘方</span><span class="company-name">模拟乙公司</span>';};document.querySelector('.resume-list').append(row);}};
document.querySelector('#cv-send').onclick=()=>{events.push('send:'+current+':'+picked);sessionStorage.setItem('sends',String(Number(sessionStorage.getItem('sends')||0)+1));if(mode!=='unconfirmed'){dialog.hidden=true;record.innerHTML+='<p>附件简历请求已发送</p>';}};
document.querySelector('#cv-close').onclick=()=>dialog.hidden=true;
render();
</script></html>
